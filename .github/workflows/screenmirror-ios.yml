name: ScreenMirror iOS build

on:
  push:
    paths:
      - "ScreenMirror/**"
      - ".github/workflows/screenmirror-ios.yml"
  pull_request:
    paths:
      - "ScreenMirror/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ScreenMirror
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScreenMirror.xcodeproj \
            -scheme ScreenMirror \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
