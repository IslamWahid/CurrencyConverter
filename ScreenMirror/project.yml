# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: ScreenMirror

options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # Set these before running on a device.
    DEVELOPMENT_TEAM: ""
    APP_BUNDLE_ID: com.yourcompany.ScreenMirror
    APP_GROUP_ID: group.com.yourcompany.screenmirror
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  ScreenMirror:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Screen Mirror
        AppGroupIdentifier: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Screen Mirror finds TVs on your Wi-Fi and streams your screen, photos and videos to them.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/ScreenMirror.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        # Needed to discover TVs (SSDP multicast). Request it from Apple:
        # https://developer.apple.com/contact/request/networking-multicast
        com.apple.developer.networking.multicast: true
    dependencies:
      - target: BroadcastExtension
    scheme: {}

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - BroadcastExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Broadcast
        PRODUCT_NAME: ScreenMirrorBroadcast
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: Screen Mirror
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSLocalNetworkUsageDescription: Screen Mirror streams your screen to TVs and browsers on your Wi-Fi.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: BroadcastExtension/BroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
